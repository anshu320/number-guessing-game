<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number guessing game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Number Guessing Game</h1>

    <p>We have selected a random numbers between 1 to 100.see if you can guess it in 10 turns or fewer.
        we'll tell you if your guess was too high or low.
    </p>

    <div class="form">
        <label for="guessField">Enter a Guess: </label>
        <input type="number" min="1" max="100" required id="guessField" />
        <button type="submit" value="Submit guess" class="guessSubmit">Guess</button>
    </div>

    <div class="resultParas">
        <p class="guesses"></p>
        <p class="lastResult"></p>
        <p class="lowOrHi"></p>
    </div>
    
    <script src ="script.js"></script>
</body>
</html>
